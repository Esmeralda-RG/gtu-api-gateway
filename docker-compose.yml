services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "80:8080"
    environment:
      - EUREKA_SERVER_HOST=discovery-server
      - EUREKA_SERVER_PORT=8761
      - GATEWAY_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - shared_network
networks:
  shared_network:
    external: true
